[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-result-cache"
version = "0.1.0"
description = "LRU plus TTL cache for agent tool call results"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["cache", "lru", "ttl", "agent", "tools", "llm", "memoization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/agent-tool-result-cache"
Repository = "https://github.com/MukundaKatta/agent-tool-result-cache"
Issues = "https://github.com/MukundaKatta/agent-tool-result-cache/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_tool_result_cache = ["py.typed"]
