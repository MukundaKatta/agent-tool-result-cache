[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-tool-result-cache"
version = "0.1.0"
description = "In-process LRU+TTL cache for TOOL call results (web fetch, DB query, etc.). Per-tool TTL override, decorator, sync+async, optional JSONL persistence. Zero runtime deps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mukunda Rao Katta", email = "mukunda.vjcs6@gmail.com" }]
keywords = [
  "llm",
  "ai",
  "agent",
  "tool",
  "cache",
  "ttl",
  "agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/agent-tool-result-cache"
Issues = "https://github.com/MukundaKatta/agent-tool-result-cache/issues"
Source = "https://github.com/MukundaKatta/agent-tool-result-cache"
"Sibling: llm-cache-mem" = "https://pypi.org/project/llm-cache-mem/"
"Sibling: llm-batch-coalesce" = "https://pypi.org/project/llm-batch-coalesce/"
"Sibling: llm-message-hash-py" = "https://pypi.org/project/llm-message-hash-py/"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tool_result_cache"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
